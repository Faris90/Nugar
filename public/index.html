<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Agar.io Clone - Retro Compatible</title>
  
  <link href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.4/css/bootstrap.min.css" rel="stylesheet">
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #111; }
    canvas { display: block; width: 100%; height: 100%; }

    #overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.7); display: table; z-index: 10; text-align: center;
    }
    .overlay-cell {
      display: table-cell; vertical-align: middle; text-align: center;
    }

    .touch-btn {
      position: absolute; bottom: 30px; width: 65px; height: 65px;
      border-radius: 50% !important; font-weight: bold;
      display: none; text-align: center; line-height: 50px; font-size: 14px; z-index: 5;
    }
    #btn-split { right: 30px; }
    #btn-eject { right: 110px; }

    @media (pointer: coarse) {
      .touch-btn { display: block; }
    }
  </style>
</head>
<body>

  <div id="overlay">
    <div class="overlay-cell">
      <div class="panel panel-default center-block shadow-lg" style="width: 320px; background-color: #222; border-color: #444; color: #fff;">
        <div class="panel-heading" style="background-color: #2a2a2a; border-color: #444; color: #fff;">
          <h3 class="panel-title text-center" style="font-weight: bold;">Agar.io Clone</h3>
        </div>
        <div class="panel-body">
          <div class="form-group">
            <input type="text" id="nickname" class="form-control text-center" placeholder="Enter Nickname" maxlength="12" style="background-color: #111; border-color: #444; color: #fff;">
          </div>
          <div class="form-group">
            <input type="text" id="skin" class="form-control text-center" placeholder="Skin Image URL (optional)" maxlength="255" style="background-color: #111; border-color: #444; color: #fff;">
          </div>
          <div class="form-group">
            <select id="room-select" class="form-control text-center" style="background-color: #111; border-color: #444; color: #fff;">
              <option value="default">Default Room</option>
            </select>
          </div>
          <button id="start-btn" class="btn btn-primary btn-lg btn-block" style="font-weight: bold;">Play</button>
        </div>
      </div>
    </div>
  </div>

  <button id="btn-split" class="btn btn-default touch-btn shadow">SPLIT</button>
  <button id="btn-eject" class="btn btn-default touch-btn shadow">EJECT</button>

  <canvas id="gameCanvas"></canvas>

  <script>
    var canvas = document.getElementById('gameCanvas');
    var ctx = canvas.getContext('2d');

    var ws = null;
    var myPlayerId = null;
    var worldSize = 8000;
    var isDead = false;
    
    var clientEntitiesMap = {};
    var clientPlayersMap = {};
    var skinImageCache = {};
    var localCells = []; 
    var leaderboardData = [];

    var mouseX = window.innerWidth / 2;
    var mouseY = window.innerHeight / 2;
    var offsetX = 0;
    var offsetY = 0;

    var touchJoystick = null;
    var lastTargetSend = 0;
    var currentMaxRadius = 40;

    function getRadius(mass) {
      return Math.sqrt(mass) * 6;
    }

    var camera = {
      x: worldSize / 2,
      y: worldSize / 2,
      scale: 1,
      targetX: worldSize / 2,
      targetY: worldSize / 2,
      targetScale: 1
    };

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    fetch('/api/rooms')
      .then(function(res) { return res.json(); })
      .then(function(rooms) {
        var select = document.getElementById('room-select');
        select.innerHTML = '';
        rooms.forEach(function(room) {
          var opt = document.createElement('option');
          opt.value = room.name;
          opt.textContent = room.name.toUpperCase() + (room.teamMode ? ' (Teams)' : ' (FFA)') + ' - Players: ' + room.players;
          select.appendChild(opt);
        });
      })
      .catch(function(err) { console.error('Failed to load rooms', err); });

    function getSkinImage(url) {
      if (!url) return null;
      if (skinImageCache[url]) {
        return skinImageCache[url];
      }
      var img = new Image();
      img.crossOrigin = 'anonymous';
      img.src = url;
      skinImageCache[url] = img;
      return img;
    }

    document.getElementById('start-btn').onclick = function() {
      var name = document.getElementById('nickname').value;
      var skin = document.getElementById('skin').value;
      var selectedRoom = document.getElementById('room-select').value || 'default';
      document.getElementById('overlay').style.display = 'none';
      
      localCells = [];

      if (!ws || ws.readyState !== WebSocket.OPEN) {
        if (ws) {
          ws.onclose = null;
          ws.onerror = null;
          ws.onmessage = null;
        }

        var protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        ws = new WebSocket(protocol + '//' + window.location.host + '/?room=' + encodeURIComponent(selectedRoom));

        ws.onclose = function() { handleDeath(); };
        ws.onerror = function() { handleDeath(); };

        ws.onmessage = function(evt) {
          var msg = JSON.parse(evt.data);

          if (msg.type === 'init') {
            myPlayerId = msg.playerId;
            worldSize = msg.worldSize;
            ws.send(JSON.stringify({ type: 'join', name: name, skin: skin }));
          } else if (msg.type === 'state') {
            leaderboardData = msg.leaderboard || [];

            var currentEntityIds = {};
            var i, j;
            
            for (i = 0; i < msg.entities.length; i++) {
              var sEnt = msg.entities[i];
              currentEntityIds[sEnt.id] = true;
              var cEnt = clientEntitiesMap[sEnt.id];
              if (!cEnt) {
                clientEntitiesMap[sEnt.id] = {
                  id: sEnt.id,
                  type: sEnt.type,
                  x: sEnt.x,
                  y: sEnt.y,
                  mass: sEnt.mass,
                  color: sEnt.color,
                  isSpiky: sEnt.isSpiky,
                  radius: getRadius(sEnt.mass),
                  targetX: sEnt.x,
                  targetY: sEnt.y,
                  targetMass: sEnt.mass,
                  eatenLocally: false
                };
              } else {
                cEnt.type = sEnt.type;
                cEnt.color = sEnt.color;
                cEnt.isSpiky = sEnt.isSpiky;
                cEnt.targetX = sEnt.x;
                cEnt.targetY = sEnt.y;
                cEnt.targetMass = sEnt.mass;
              }
            }
            
            for (var eId in clientEntitiesMap) {
              if (clientEntitiesMap.hasOwnProperty(eId) && !currentEntityIds[eId]) {
                delete clientEntitiesMap[eId];
              }
            }

            var activePlayerIds = {};
            for (i = 0; i < msg.players.length; i++) {
              activePlayerIds[msg.players[i].id] = true;
            }
            for (var pId in clientPlayersMap) {
              if (clientPlayersMap.hasOwnProperty(pId) && !activePlayerIds[pId]) {
                delete clientPlayersMap[pId];
              }
            }

            for (i = 0; i < msg.players.length; i++) {
              var sPlayer = msg.players[i];
              var pObj = clientPlayersMap[sPlayer.id];
              if (!pObj) {
                pObj = { id: sPlayer.id, name: sPlayer.name, color: sPlayer.color, skin: sPlayer.skin, cells: {} };
                clientPlayersMap[sPlayer.id] = pObj;
              }
              pObj.name = sPlayer.name;
              pObj.color = sPlayer.color;
              pObj.skin = sPlayer.skin;

              var currentCellIds = {};
              for (j = 0; j < sPlayer.cells.length; j++) {
                var sCell = sPlayer.cells[j];
                currentCellIds[sCell.id] = true;
                var cCell = pObj.cells[sCell.id];
                if (!cCell) {
                  pObj.cells[sCell.id] = {
                    id: sCell.id,
                    x: sCell.x,
                    y: sCell.y,
                    mass: sCell.mass,
                    targetX: sCell.x,
                    targetY: sCell.y,
                    targetMass: sCell.mass,
                    radius: getRadius(sCell.mass),
                    spawnProtectedUntil: sCell.spawnProtectedUntil,
                    isSpiky: sCell.isSpiky
                  };
                } else {
                  cCell.targetX = sCell.x;
                  cCell.targetY = sCell.y;
                  cCell.targetMass = sCell.mass;
                  cCell.vx = sCell.vx;
                  cCell.vy = sCell.vy;
                  cCell.canMergeAfter = sCell.canMergeAfter;
                  cCell.spawnProtectedUntil = sCell.spawnProtectedUntil;
                  cCell.isSpiky = sCell.isSpiky;
                }
              }
              for (var cId in pObj.cells) {
                if (pObj.cells.hasOwnProperty(cId) && !currentCellIds[cId]) {
                  delete pObj.cells[cId];
                }
              }
            }

            var me = null;
            for (i = 0; i < msg.players.length; i++) {
              if (msg.players[i].id === myPlayerId) {
                me = msg.players[i];
                break;
              }
            }

            if (me && me.cells.length > 0) {
              isDead = false;
              if (localCells.length === 0) {
                localCells = [];
                var sumX = 0, sumY = 0;
                for (i = 0; i < me.cells.length; i++) {
                  var c = me.cells[i];
                  localCells.push({
                    id: c.id,
                    x: c.x,
                    y: c.y,
                    mass: c.mass,
                    targetX: c.x,
                    targetY: c.y,
                    targetMass: c.mass,
                    radius: getRadius(c.mass),
                    spawnProtectedUntil: c.spawnProtectedUntil,
                    isSpiky: c.isSpiky
                  });
                  sumX += c.x;
                  sumY += c.y;
                }
                var spawnX = sumX / me.cells.length;
                var spawnY = sumY / me.cells.length;
                camera.x = spawnX;
                camera.y = spawnY;
                camera.targetX = spawnX;
                camera.targetY = spawnY;
              } else {
                for (i = 0; i < me.cells.length; i++) {
                  var sCell = me.cells[i];
                  var lCell = null;
                  for (var k = 0; k < localCells.length; k++) {
                    if (localCells[k].id === sCell.id) {
                      lCell = localCells[k];
                      break;
                    }
                  }
                  if (lCell) {
                    lCell.targetX = sCell.x;
                    lCell.targetY = sCell.y;
                    lCell.targetMass = sCell.mass;
                    lCell.vx = sCell.vx;
                    lCell.vy = sCell.vy;
                    lCell.canMergeAfter = sCell.canMergeAfter;
                    lCell.spawnProtectedUntil = sCell.spawnProtectedUntil;
                    lCell.isSpiky = sCell.isSpiky;
                  } else {
                    localCells.push({
                      id: sCell.id,
                      x: sCell.x,
                      y: sCell.y,
                      mass: sCell.mass,
                      targetX: sCell.x,
                      targetY: sCell.y,
                      targetMass: sCell.mass,
                      radius: getRadius(sCell.mass),
                      spawnProtectedUntil: sCell.spawnProtectedUntil,
                      isSpiky: sCell.isSpiky
                    });
                  }
                }
                
                var filteredLocal = [];
                for (k = 0; k < localCells.length; k++) {
                  var match = false;
                  for (i = 0; i < me.cells.length; i++) {
                    if (me.cells[i].id === localCells[k].id) {
                      match = true;
                      break;
                    }
                  }
                  if (match) filteredLocal.push(localCells[k]);
                }
                localCells = filteredLocal;
              }
            } else if (localCells.length > 0) {
              handleDeath();
            }
          }
        };
      } else {
        ws.send(JSON.stringify({ type: 'join', name: name, skin: skin }));
      }
    };

    function handleDeath() {
      isDead = true;
      localCells = [];
      document.getElementById('overlay').style.display = 'table';
    }

    window.addEventListener('mousemove', function(e) {
      if (touchJoystick) return;
      mouseX = e.clientX;
      mouseY = e.clientY;
    });

    window.addEventListener('keydown', function(e) {
      if (isDead) return;
      if (e.code === 'Space' || e.keyCode === 32) sendAction('split');
      if (e.code === 'KeyW' || e.keyCode === 87) sendAction('eject');
    });

    window.addEventListener('touchstart', function(e) {
      for (var i = 0; i < e.changedTouches.length; i++) {
        var t = e.changedTouches[i];
        if (t.clientX < window.innerWidth / 2 && !touchJoystick) {
          touchJoystick = { id: t.identifier, startX: t.clientX, startY: t.clientY, currX: t.clientX, currY: t.clientY };
        }
      }
    });

    window.addEventListener('touchmove', function(e) {
      for (var i = 0; i < e.changedTouches.length; i++) {
        var t = e.changedTouches[i];
        if (touchJoystick && t.identifier === touchJoystick.id) {
          touchJoystick.currX = t.clientX;
          touchJoystick.currY = t.clientY;
        }
      }
    });

    var endTouch = function(e) {
      for (var i = 0; i < e.changedTouches.length; i++) {
        if (touchJoystick && e.changedTouches[i].identifier === touchJoystick.id) {
          touchJoystick = null;
        }
      }
    };
    window.addEventListener('touchend', endTouch);
    window.addEventListener('touchcancel', endTouch);

    document.getElementById('btn-split').addEventListener('touchstart', function(e) { e.preventDefault(); if(!isDead) sendAction('split'); });
    document.getElementById('btn-eject').addEventListener('touchstart', function(e) { e.preventDefault(); if(!isDead) sendAction('eject'); });

    function sendAction(type) {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: type }));
      }
    }

    function darkenColor(hex, percent) {
      if (!hex || hex.indexOf('#') !== 0) return '#222222';
      percent = percent || 0.25;
      var num = parseInt(hex.slice(1), 16);
      var r = Math.max(0, (num >> 16) - Math.round(255 * percent));
      var g = Math.max(0, ((num >> 8) & 0x00ff) - Math.round(255 * percent));
      var b = Math.max(0, (num & 0x0000ff) - Math.round(255 * percent));
      return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
    }

    function drawEntity(ctx, entity) {
      ctx.save();
      ctx.translate(entity.x, entity.y);

      var isProtected = entity.spawnProtectedUntil && entity.spawnProtectedUntil > new Date().getTime();
      if (isProtected) {
        ctx.globalAlpha = 0.4;
      }

      ctx.beginPath();
      if (entity.isSpiky) {
        var spikes = 20;
        var outerRadius = entity.radius;
        var innerRadius = entity.radius * 0.88;
        for (var i = 0; i < spikes * 2; i++) {
          var r = (i % 2 === 0) ? outerRadius : innerRadius;
          var angle = (i / (spikes * 2)) * Math.PI * 2;
          var x = Math.cos(angle) * r;
          var y = Math.sin(angle) * r;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.closePath();
      } else {
        ctx.arc(0, 0, entity.radius, 0, Math.PI * 2);
      }

      ctx.fillStyle = entity.color || '#fff';
      ctx.fill();

      if (entity.skin) {
        var skinImg = getSkinImage(entity.skin);
        if (skinImg && skinImg.complete && skinImg.naturalWidth !== 0) {
          ctx.save();
          ctx.clip();
          ctx.drawImage(skinImg, -entity.radius * 1.2, -entity.radius * 1.2, entity.radius * 2.4, entity.radius * 2.4);
          ctx.restore();
        }
      }

      ctx.strokeStyle = darkenColor(entity.color, 0.25);
      ctx.lineWidth = Math.max(2, 0.06);
      ctx.stroke();

      if (entity.name) {
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.lineJoin = 'round';

        var nameFontSize = Math.max(14, entity.radius * 0.35);
        var nameY = entity.mass ? -entity.radius * 0.15 : 0;
        
        ctx.font = 'bold ' + nameFontSize + 'px sans-serif';
        ctx.lineWidth = nameFontSize * 0.25;
        ctx.strokeStyle = '#000000';
        ctx.strokeText(entity.name, 0, nameY);

        ctx.fillStyle = '#ffffff';
        ctx.fillText(entity.name, 0, nameY);

        if (entity.mass && entity.radius > 18) {
          var massFontSize = Math.max(11, entity.radius * 0.25);
          var massY = entity.radius * 0.25;

          ctx.font = 'bold ' + massFontSize + 'px sans-serif';
          ctx.lineWidth = massFontSize * 0.25;
          ctx.strokeStyle = '#000000';
          ctx.strokeText(Math.floor(entity.mass), 0, massY);

          ctx.fillStyle = '#ffffff';
          ctx.fillText(Math.floor(entity.mass), 0, massY);
        }
      }

      ctx.restore();
    }

    function interpolateEntitiesAndRemotePlayers(dt) {
      var lerpSpeed = Math.min(1, 0.25 * dt);

      for (var eId in clientEntitiesMap) {
        if (clientEntitiesMap.hasOwnProperty(eId)) {
          var cEnt = clientEntitiesMap[eId];
          cEnt.x += (cEnt.targetX - cEnt.x) * lerpSpeed;
          cEnt.y += (cEnt.targetY - cEnt.y) * lerpSpeed;
          if (cEnt.targetMass !== undefined) {
            cEnt.mass += (cEnt.targetMass - cEnt.mass) * lerpSpeed;
            cEnt.radius = getRadius(cEnt.mass);
          }
        }
      }

      for (var pId in clientPlayersMap) {
        if (clientPlayersMap.hasOwnProperty(pId)) {
          if (pId === myPlayerId) continue;
          var pObj = clientPlayersMap[pId];
          for (var cId in pObj.cells) {
            if (pObj.cells.hasOwnProperty(cId)) {
              var cCell = pObj.cells[cId];
              cCell.x += (cCell.targetX - cCell.x) * lerpSpeed;
              cCell.y += (cCell.targetY - cCell.y) * lerpSpeed;
              if (cCell.targetMass !== undefined) {
                cCell.mass += (cCell.targetMass - cCell.mass) * lerpSpeed;
                cCell.radius = getRadius(cCell.mass);
              }
            }
          }
        }
      }
    }

    function predictLocalPhysics(dt) {
      if (isDead || localCells.length === 0) return;

      var mouseWorldX = camera.x + ((mouseX - canvas.width / 2) / camera.scale);
      var mouseWorldY = camera.y + ((mouseY - canvas.height / 2) / camera.scale);

      for (var i = 0; i < localCells.length; i++) {
        var cell = localCells[i];
        var dx = mouseWorldX - cell.x;
        var dy = mouseWorldY - cell.y;
        var distToMouse = Math.sqrt(dx * dx + dy * dy);
        var angle = Math.atan2(dy, dx);
        var distScale = Math.min(1, distToMouse / 100);

        if (distToMouse > 5) {
          var baseSpeed = Math.max(1.5, 14 * Math.pow(cell.mass, -0.25)) * distScale;
          cell.vx = (cell.vx || 0) + Math.cos(angle) * baseSpeed * 0.25 * dt;
          cell.vy = (cell.vy || 0) + Math.sin(angle) * baseSpeed * 0.25 * dt;
        }

        cell.x += (cell.vx || 0) * dt;
        cell.y += (cell.vy || 0) * dt;

        if (cell.targetX !== undefined && cell.targetY !== undefined) {
          cell.x += (cell.targetX - cell.x) * 0.15 * dt;
          cell.y += (cell.targetY - cell.y) * 0.15 * dt;
        }

        cell.vx = (cell.vx || 0) * Math.pow(0.85, dt);
        cell.vy = (cell.vy || 0) * Math.pow(0.85, dt);

        cell.x = Math.max(cell.radius, Math.min(worldSize - cell.radius, cell.x));
        cell.y = Math.max(cell.radius, Math.min(worldSize - cell.radius, cell.y));

        if (cell.targetMass !== undefined) {
          cell.mass += (cell.targetMass - cell.mass) * Math.min(1, 0.15 * dt);
          cell.radius = getRadius(cell.mass);
        }

        for (var eId in clientEntitiesMap) {
          if (clientEntitiesMap.hasOwnProperty(eId)) {
            var e = clientEntitiesMap[eId];
            if (e.type === 'food' && !e.eatenLocally) {
              var foodDist = Math.sqrt(Math.pow(cell.x - e.x, 2) + Math.pow(cell.y - e.y, 2));
              if (foodDist <= cell.radius + e.radius + 8) {
                e.eatenLocally = true;
                cell.targetMass = (cell.targetMass || cell.mass) + e.mass;
              }
            }
          }
        }
      }
    }

    var lastTime = 0;
    var renderList = [];

    function render(time) {
      if (!lastTime) lastTime = time;
      var dt = (time - lastTime) / (1000 / 30);
      dt = Math.min(dt, 3);
      lastTime = time;

      if (touchJoystick) {
        var jdx = touchJoystick.currX - touchJoystick.startX;
        var jdy = touchJoystick.currY - touchJoystick.startY;
        var jdist = Math.min(100, Math.sqrt(jdx * jdx + jdy * jdy));
        var jangle = Math.atan2(jdy, jdx);
        offsetX = Math.cos(jangle) * jdist;
        offsetY = Math.sin(jangle) * jdist;
      } else {
        offsetX = mouseX - canvas.width / 2;
        offsetY = mouseY - canvas.height / 2;
      }

      var nowMs = new Date().getTime();
      if (!isDead && ws && ws.readyState === WebSocket.OPEN && nowMs - lastTargetSend > 33) {
        ws.send(JSON.stringify({ type: 'target', offsetX: offsetX, offsetY: offsetY }));
        lastTargetSend = nowMs;
      }

      interpolateEntitiesAndRemotePlayers(dt);
      predictLocalPhysics(dt);

      if (!isDead && localCells.length > 0) {
        var totalMass = 0;
        var minX = Infinity, maxX = -Infinity;
        var minY = Infinity, maxY = -Infinity;
        var sumX = 0, sumY = 0;

        for (var i = 0; i < localCells.length; i++) {
          var cell = localCells[i];
          totalMass += cell.mass;
          sumX += cell.x;
          sumY += cell.y;

          if (cell.x - cell.radius < minX) minX = cell.x - cell.radius;
          if (cell.x + cell.radius > maxX) maxX = cell.x + cell.radius;
          if (cell.y - cell.radius < minY) minY = cell.y - cell.radius;
          if (cell.y + cell.radius > maxY) maxY = cell.y + cell.radius;
        }

        camera.targetX = sumX / localCells.length;
        camera.targetY = sumY / localCells.length;

        var baseRadius = Math.sqrt(totalMass) * 6;
        var spreadX = (maxX - minX) / 2;
        var spreadY = (maxY - minY) / 2;
        var actualSpreadRadius = Math.max(spreadX, spreadY);

        var targetRadius = Math.max(baseRadius, actualSpreadRadius);
        currentMaxRadius += (targetRadius - currentMaxRadius) * Math.min(1, 0.1 * dt);

        var screenMin = Math.min(canvas.width, canvas.height);
        var targetViewSize = Math.max(800, currentMaxRadius * 3.5 + 200);
        
        camera.targetScale = Math.min(1.2, screenMin / targetViewSize);
      }

      var camLerp = Math.min(1, 0.08 * dt);
      camera.x += (camera.targetX - camera.x) * camLerp;
      camera.y += (camera.targetY - camera.y) * camLerp;
      camera.scale += (camera.targetScale - camera.scale) * camLerp;

      ctx.fillStyle = '#181818';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.save();
      ctx.translate(canvas.width / 2, canvas.height / 2);
      ctx.scale(camera.scale, camera.scale);
      ctx.translate(-camera.x, -camera.y);

      ctx.strokeStyle = 'rgba(255, 255, 255, 0.04)';
      ctx.lineWidth = 1;
      var gridSize = 60;
      for (var gx = 0; gx <= worldSize; gx += gridSize) {
        ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx, worldSize); ctx.stroke();
      }
      for (var gy = 0; gy <= worldSize; gy += gridSize) {
        ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(worldSize, gy); ctx.stroke();
      }

      ctx.strokeStyle = '#333';
      ctx.lineWidth = 8;
      ctx.strokeRect(0, 0, worldSize, worldSize);

      renderList.length = 0;

      for (var eId in clientEntitiesMap) {
        if (clientEntitiesMap.hasOwnProperty(eId)) {
          var entity = clientEntitiesMap[eId];
          if (!entity.eatenLocally) {
            renderList.push(entity);
          }
        }
      }

      for (var pId in clientPlayersMap) {
        if (clientPlayersMap.hasOwnProperty(pId)) {
          if (pId === myPlayerId) continue;
          var player = clientPlayersMap[pId];
          for (var cId in player.cells) {
            if (player.cells.hasOwnProperty(cId)) {
              var rCell = player.cells[cId];
              renderList.push({
                id: rCell.id,
                x: rCell.x,
                y: rCell.y,
                mass: rCell.mass,
                radius: rCell.radius,
                color: player.color,
                name: player.name,
                skin: player.skin,
                isSpiky: rCell.isSpiky,
                spawnProtectedUntil: rCell.spawnProtectedUntil
              });
            }
          }
        }
      }

      if (!isDead) {
        var myPlayer = clientPlayersMap[myPlayerId];
        var myColor = myPlayer ? myPlayer.color : '#fff';
        var myName = myPlayer ? myPlayer.name : '';
        var mySkin = myPlayer ? myPlayer.skin : '';

        for (var l = 0; l < localCells.length; l++) {
          var lCellItem = localCells[l];
          renderList.push({
            id: lCellItem.id,
            x: lCellItem.x,
            y: lCellItem.y,
            mass: lCellItem.mass,
            radius: lCellItem.radius,
            color: myColor,
            name: myName,
            skin: mySkin,
            isSpiky: lCellItem.isSpiky,
            spawnProtectedUntil: lCellItem.spawnProtectedUntil
          });
        }
      }

      renderList.sort(function(a, b) {
        return (a.radius || 0) - (b.radius || 0);
      });

      for (var r = 0; r < renderList.length; r++) {
        drawEntity(ctx, renderList[r]);
      }

      ctx.restore();

      ctx.save();
      ctx.fillStyle = 'rgba(0, 0, 0, 0.45)';
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
      ctx.lineWidth = 2;
      var lbWidth = 200;
      
      var isTeamMode = leaderboardData.length > 0 && leaderboardData[0].percentage !== undefined;
      var lbHeight = isTeamMode ? 220 : 40 + (Math.max(1, Math.min(leaderboardData.length, 10)) * 20);
      var lbX = canvas.width - lbWidth - 20;
      var lbY = 20;

      ctx.fillRect(lbX, lbY, lbWidth, lbHeight);
      ctx.strokeRect(lbX, lbY, lbWidth, lbHeight);

      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 13px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'top';
      ctx.fillText(isTeamMode ? 'Teams Leaderboard' : 'Leaderboard', lbX + lbWidth / 2, lbY + 10);

      if (isTeamMode) {
        var centerX = lbX + lbWidth / 2;
        var centerY = lbY + 95;
        var radius = 50;
        var startAngle = 0;

        var totalMass = leaderboardData.reduce(function(sum, item) { return sum + (item.mass || 0); }, 0);

        if (totalMass === 0) {
          ctx.beginPath();
          ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
          ctx.fillStyle = '#444';
          ctx.fill();
        } else {
          for (var i = 0; i < leaderboardData.length; i++) {
            var slice = leaderboardData[i];
            var sliceAngle = (slice.mass / totalMass) * Math.PI * 2;
            
            ctx.beginPath();
            ctx.moveTo(centerX, centerY);
            ctx.arc(centerX, centerY, radius, startAngle, startAngle + sliceAngle);
            ctx.closePath();
            ctx.fillStyle = slice.color;
            ctx.fill();
            ctx.strokeStyle = '#222';
            ctx.lineWidth = 1;
            ctx.stroke();

            startAngle += sliceAngle;
          }
        }

        ctx.font = '11px sans-serif';
        ctx.textAlign = 'left';
        for (var ld = 0; ld < leaderboardData.length; ld++) {
          var item = leaderboardData[ld];
          var legendY = lbY + 158 + (ld * 14);
          
          ctx.fillStyle = item.color;
          ctx.fillRect(lbX + 15, legendY, 10, 10);
          
          ctx.fillStyle = '#ffffff';
          ctx.fillText(item.name + ': ' + (item.percentage || 0) + '% (' + item.mass + ')', lbX + 32, legendY);
        }
      } else {
        ctx.font = '12px sans-serif';
        ctx.textAlign = 'left';
        if (leaderboardData.length === 0) {
          ctx.fillStyle = '#888';
          ctx.fillText('Waiting for players...', lbX + 15, lbY + 40);
        } else {
          for (var ldi = 0; ldi < leaderboardData.length && ldi < 10; ldi++) {
            var entry = leaderboardData[ldi];
            var entryY = lbY + 38 + (ldi * 18);
            
            var rankText = (ldi + 1) + '. ';
            var nameText = entry.name || 'Unnamed';
            var scoreText = ' - ' + entry.mass;
            
            if (entry.id === myPlayerId) {
              ctx.fillStyle = '#ffeb3b';
            } else {
              ctx.fillStyle = '#ffffff';
            }
            
            ctx.fillText(rankText + nameText + scoreText, lbX + 15, entryY);
          }
        }
      }
      ctx.restore();

      ctx.save();
      ctx.fillStyle = 'rgba(0, 0, 0, 0.45)';
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
      ctx.lineWidth = 2;
      var scoreWidth = 115;
      var scoreHeight = 30;
      var scoreX = 20;
      var scoreY = 20;

      ctx.fillRect(scoreX, scoreY, scoreWidth, scoreHeight);
      ctx.strokeRect(scoreX, scoreY, scoreWidth, scoreHeight);

      var totalScore = 0;
      if (!isDead) {
        for (var s = 0; s < localCells.length; s++) {
          totalScore += localCells[s].mass;
        }
      }

      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 13px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('Score: ' + Math.floor(totalScore), scoreX + scoreWidth / 2, scoreY + scoreHeight / 2);
      ctx.restore();

      if (touchJoystick) {
        ctx.save();
        ctx.beginPath();
        ctx.arc(touchJoystick.startX, touchJoystick.startY, 45, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
        ctx.fill();
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(touchJoystick.currX, touchJoystick.currY, 20, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
        ctx.fill();
        ctx.restore();
      }

      window.requestAnimationFrame(render);
    }

    window.requestAnimationFrame(render);
  </script>
</body>
</html>
